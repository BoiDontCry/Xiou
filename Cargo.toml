[package]
name = "foxmail-imap-poc"
version = "0.1.0"
edition = "2021"

[lib]
name = "foxmail_imap"
path = "src/lib.rs"

[[bin]]
name = "imap-poc"
path = "src/imap_poc.rs"

[[bin]]
name = "backup"
path = "src/backup.rs"

[[bin]]
name = "validate-eml"
path = "src/validate_eml.rs"

[[bin]]
name = "import-eml"
path = "src/import_eml.rs"

[[bin]]
name = "foxmail-rs"
path = "src/main.rs"

[[bin]]
name = "smtp-send"
path = "src/smtp_send.rs"

[dependencies]
imap = "3.0.0-alpha.15"
imap-proto = "0.16.7"
mail-parser = "0.9"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview" }
gpui_platform = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = ["font-kit"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
