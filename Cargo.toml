[package]
name = "foxmail-imap-poc"
version = "0.1.0"
edition = "2021"

[lib]
name = "foxmail_imap"
path = "src/lib.rs"

[[bin]]
name = "imap-poc"
path = "src/imap_poc.rs"

[[bin]]
name = "backup"
path = "src/backup.rs"

[[bin]]
name = "validate-eml"
path = "src/validate_eml.rs"

[dependencies]
imap = "3.0.0-alpha.15"
imap-proto = "0.16.7"
mail-parser = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
